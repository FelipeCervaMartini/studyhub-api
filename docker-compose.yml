# API + banco para rodar local e no pipeline (a produção usa deploy/docker-compose.prod.yml).
#   docker compose up -d --build
# As variáveis vêm do arquivo .env (veja .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-studyhub}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposto apenas na máquina local, para ferramentas de desenvolvimento.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: studyhub-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-studyhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-studyhub}
    ports:
      - "${API_PORT:-3000}:3000"

  # ---------- Monitoramento (opcional): docker compose --profile monitoring up -d ----------

  # Coleta e guarda as métricas que a API expõe em /metrics. Abre em http://localhost:9090.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  # Painel das métricas, que já sobe configurado. Abre em http://localhost:3001.
  grafana:
    image: grafana/grafana:13.3.1
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/studyhub-api.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

volumes:
  db-data:
  prometheus-data:
  grafana-data:
