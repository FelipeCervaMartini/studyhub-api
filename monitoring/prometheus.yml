# Configuração do Prometheus: de quem ele coleta as métricas e com que frequência.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Regras de alerta (arquivo ao lado).
rule_files:
  - alerts.yml

scrape_configs:
  # A cada 15s o Prometheus chama GET /metrics na API, pela rede interna do Docker.
  - job_name: studyhub-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
